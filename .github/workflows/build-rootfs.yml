name: Build Ubuntu 26.04.1 arm64 rootfs

# 用途：用 debootstrap 构建完整的 Ubuntu 26.04.1 (Resolute Raccoon) arm64 rootfs，
#       内置 zsh + Nerd Font 主题、中文本地化、常用工具、NVM/Node LTS、dsh (DeepSeek Harness)、
#       OpenSSH / systemd，用于 DroidSpaces。
#
# 触发方式：
#   1) 手动：Actions -> 本 workflow -> Run workflow
#   2) 推送 tag（v*）时自动构建并发布到 GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/build-rootfs.yml'
      - 'scripts/**'

env:
  RELEASE: resolute
  VERSION: 26.04.1
  ARCH: arm64
  # 构建期镜像：EC2 us-east-2；最终 rootfs 内会改回中科大源
  MIRROR: http://us-east-2.ec2.archive.ubuntu.com/ubuntu

permissions:
  contents: write

concurrency:
  group: build-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: 构建 rootfs
        run: |
          chmod +x scripts/build-rootfs.sh
          ./scripts/build-rootfs.sh

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ env.VERSION }}-${{ env.ARCH }}-rootfs
          path: ubuntu-${{ env.VERSION }}-${{ env.ARCH }}-rootfs.tar.gz
          retention-days: 30

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ubuntu-${{ env.VERSION }}-${{ env.ARCH }}-rootfs.tar.gz
          generate_release_notes: true
