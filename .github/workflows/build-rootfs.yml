name: Build Arch Linux arm64 rootfs

# 用途：用 Docker 构建 Arch Linux ARM (aarch64) rootfs，
#       内置 zsh + Nerd Font 主题、中文本地化、常用工具、OpenSSH / systemd，
#       软件源：中科大（主源 + archlinuxcn）+ 南京大学（arch4edu），用于 DroidSpaces。
#
# 触发方式：
#   1) 手动：Actions -> 本 workflow -> Run workflow
#   2) 推送 tag（v*）时自动构建并发布到 GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/build-rootfs.yml'
      - 'scripts/**'

env:
  ARCH: aarch64

permissions:
  contents: write

concurrency:
  group: build-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 启动 Docker
        run: |
          sudo systemctl start docker 2>/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker.io
            sudo systemctl start docker
          }
          sleep 5
          docker info

      - name: 构建 rootfs
        run: |
          chmod +x scripts/build-rootfs.sh
          ./scripts/build-rootfs.sh

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: arch-${{ env.ARCH }}-rootfs
          path: arch-${{ env.ARCH }}-rootfs.tar.gz
          retention-days: 30

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: arch-${{ env.ARCH }}-rootfs.tar.gz
          generate_release_notes: true
